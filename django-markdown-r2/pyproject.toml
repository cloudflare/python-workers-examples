[project]
name = "django-markdown-r2-worker"
version = "0.1.0"
description = "Server-rendered Django knowledge base backed by Durable Object SQLite and R2"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "django",
    "django-cf==0.2.15",
    "markdown-it-py==4.2.0",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
